# 05 31 Иволга 13 — Котельная
# Финальный desired-state проход по DISCOVER Ivolga_kotel_sprut_8.json (2026-09-13 21:03:15).
# Требует Sprut Configurator v0.3.1+ с services[].match_name.
# Перед DRY RUN:
# 1) заменить 05_31_Ivolga_Kotel_House_Leaks.json на commit 26aea4fa...;
# 2) Reload templates -> MQTT Search devices;
# 3) должны появиться serial:
#    - 903.02_M1W2_LEAK_TEMP/Input 1
#    - 903.06_TEMP_NONE/Input 1
#
# Safety:
# - насосы/подмесы только read-only templates, YAML не создаёт физический write path;
# - Alice=true только у наружного света A06/K1..K6 и виртуальной лампочки 661;
# - все инженерные/технические Services, включая насосы, котёл, воду и электричество, Alice=false;
# - штатный writable WBE2-I-OPENTHERM скрывается и исключается из Alice;
# - ложная stale-плитка A03/K5 «Подача = 0 °C» скрывается, а не используется.

