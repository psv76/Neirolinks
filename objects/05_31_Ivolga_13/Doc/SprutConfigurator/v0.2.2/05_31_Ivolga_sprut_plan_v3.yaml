# Sprut Configurator plan — 05 31 Иволга 13
# v3: adjusted to field-confirmed Sprut name round-trip behavior.
#
# Field-confirmed on Sprut.hub 1.12.8 / WebUI 1.5.58:
# - leading numeric labels like "5. Свет ..." are stored as "5 Свет ...";
# - accessory/service names longer than 32 characters are truncated to 32.
#
# Therefore:
# - numeric prefixes in relay names do not use a dot;
# - two long names were shortened to <=32 chars.
#
