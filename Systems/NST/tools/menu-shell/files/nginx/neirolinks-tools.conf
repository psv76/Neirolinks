# Issue #215: static, intentionally empty NEIROLINKS Tools pages.
# Added through the supported homeui nginx drop-in directory.
# No API, executable commands, proxy or new daemon.
location ^~ /neirolinks-tools/ {
    alias /mnt/data/neirolinks-tools/pages/;
    autoindex off;
    limit_except GET HEAD { deny all; }
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}
