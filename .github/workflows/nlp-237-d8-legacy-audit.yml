name: NLP 237 D8 legacy DALI read-only audit

on:
  pull_request:
    paths:
      - '.github/workflows/nlp-237-d8-legacy-audit.yml'
      - 'Systems/NLP/src/nl_project_2/cad_sync/legacy_dali_audit.py'
      - 'Systems/NLP/tests/cad_sync/test_issue237_legacy_dali_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-dali-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Systems/NLP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0
      - name: Install pinned isolated test dependencies
        run: |
          python -m pip install 'SQLAlchemy==2.0.51' 'alembic==1.18.5' \
            'pytest==9.1.1' 'pytest-qt==4.5.0' 'PySide6==6.11.1' \
            'ruff==0.15.22'
      - name: Static lint and exact format
        run: |
          python -m ruff check src/nl_project_2/cad_sync/legacy_dali_audit.py \
            tests/cad_sync/test_issue237_legacy_dali_audit.py
          python -m ruff format --check src/nl_project_2/cad_sync/legacy_dali_audit.py \
            tests/cad_sync/test_issue237_legacy_dali_audit.py
      - name: Read-only D8 plus tested D7 and D6 physical graph regressions
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q \
            tests/cad_sync/test_issue237_legacy_dali_audit.py \
            tests/cad_sync/test_issue237_physical_dali_storage.py \
            tests/cad_sync/test_issue237_passive_physical_ownership.py \
            tests/cad_sync/test_issue237_endpoint_transactions.py \
            tests/persistence/test_issue237_physical_dali_migration.py
