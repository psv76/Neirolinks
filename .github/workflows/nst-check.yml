name: NST install and compatibility
on:
  push:
    branches: ['main', 'system/nst/**']
    paths: ['Systems/NST/**', 'objects/**/controllers/**', 'Objects/**/controllers/**', '.github/workflows/nst-check.yml']
  pull_request:
    paths: ['Systems/NST/**', 'objects/**/controllers/**', '.github/workflows/nst-check.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch immutable migration and previous NLI package source
        run: git fetch origin 9f90f17dc91f9d1ff753be66c18506027a5c03b1 d3bc8fcd78c6f4133cb4824ef74a589d90026373 df484b8bf22835001d69ddb2dd18e3eafd3792b0 d75710dad93906af8869dcce48d26e14673b63fb 14354bcf1e0033c51f02f0b242bea8aa7fa29e4e 12e5805d22e365bdbe049245fefccdc005e960fa f4673abbe52f1a89db5c84dd4c8cd391bc9ee0ef
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate and verify NST controller registry
        run: python -B Systems/NST/tools/build_controller_registry.py --check
      - name: Verify approved deployment metadata and deterministic pilot
        env:
          NST_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -B Systems/NST/tools/verify_approved_components.py
          python -B Systems/NST/tools/build_deployment.py --serial ABF62SL --output Systems/NST/deployments/ABF62SL.json --check
          python -B Systems/NST/tools/verify_deployment.py Systems/NST/deployments/ABF62SL.json
      - name: Core, identity, registry, deployment, HHM, firmware, package and security regressions
        run: python -B -m unittest discover -s Systems/NST/tests -v
      - name: Both controller roles with pinned HHM source and fake WB backend
        run: python -B Systems/NST/tests/sandbox.py
      - name: Existing approved HHM regressions
        run: |
          node Systems/NST/tests/pressure_makeup_runtime.js
          mkdir -p "$RUNNER_TEMP/hhm35"
          git archive 48408e6f1649ad17d0b3253f1b7cade258cd4fb3 objects/05_31_Ivolga_13/HHM3_FSE | tar -x -C "$RUNNER_TEMP/hhm35"
          node "$RUNNER_TEMP/hhm35/objects/05_31_Ivolga_13/HHM3_FSE/tests/run.js"
          node "$RUNNER_TEMP/hhm35/objects/05_31_Ivolga_13/HHM3_FSE/tests/partial-ready-regressions.js"
          node "$RUNNER_TEMP/hhm35/objects/05_31_Ivolga_13/HHM3_FSE/tests/persistent-storage-regressions.js"
          node "$RUNNER_TEMP/hhm35/objects/05_31_Ivolga_13/HHM3_FSE/tests/manifest.js" --check
      - name: Shell syntax
        run: |
          sh -n Systems/NST/tests/wb_package_smoke.sh
          sh -n Systems/NST/tests/wb_clean_smoke.sh
      - name: Build Debian package
        run: |
          python -B Systems/NST/tools/build_deb.py
          sha256sum Systems/NST/dist/nst_2.0_all.deb
          dpkg-deb --info Systems/NST/dist/nst_2.0_all.deb
          dpkg-deb --contents Systems/NST/dist/nst_2.0_all.deb
      - name: Clean rootfs install without NLI and desired-state bootstrap
        run: |
          docker run --rm -e NST_DISPOSABLE_CI=1 \
            -v "$PWD/Systems/NST/dist:/packages:ro" -v "$PWD/Systems/NST/tests:/tests:ro" \
            debian:trixie-slim sh /tests/wb_clean_smoke.sh
      - name: WB nodoc, upgrade, installed boiler bootstrap, reinstall and simulated FIT
        run: |
          mkdir -p "$RUNNER_TEMP/nli-old-source" "$RUNNER_TEMP/nli-old-package" "$RUNNER_TEMP/nli-persistent" "$RUNNER_TEMP/nli-evidence"
          git archive 7a022d657dc65e6b69973e459c35a78fb2e540cc NLI | tar -x -C "$RUNNER_TEMP/nli-old-source"
          python -B "$RUNNER_TEMP/nli-old-source/NLI/tools/build_deb.py" --output "$RUNNER_TEMP/nli-old-package/neiro-nli_0.1.0_all.deb"
          mkdir -p "$RUNNER_TEMP/nli-011-source"
          git archive 77b2cdc923272e1c7da68e4d46ed7bb88c53c719 NLI | tar -x -C "$RUNNER_TEMP/nli-011-source"
          python -B "$RUNNER_TEMP/nli-011-source/NLI/tools/build_deb.py" --output "$RUNNER_TEMP/nli-old-package/neiro-nli_0.1.1_all.deb"
          mkdir -p "$RUNNER_TEMP/nli-012-source"
          git archive 62abbf3b13884ab2e7e41616c85b188b89d3aa37 NLI | tar -x -C "$RUNNER_TEMP/nli-012-source"
          python -B "$RUNNER_TEMP/nli-012-source/NLI/tools/build_deb.py" --output "$RUNNER_TEMP/nli-old-package/neiro-nli_0.1.2_all.deb"
          mkdir -p "$RUNNER_TEMP/nli-013-source"
          git archive 8d3bdafab55a4c1306e598f3c3829099b7c3af3c NLI | tar -x -C "$RUNNER_TEMP/nli-013-source"
          python -B "$RUNNER_TEMP/nli-013-source/NLI/tools/build_deb.py" --output "$RUNNER_TEMP/nli-old-package/neiro-nli_0.1.3_all.deb"
          mkdir -p "$RUNNER_TEMP/nli-014-source"
          git archive 447f1fa2d24f5a7559ce60d9fb8f3a1aa7b7122f NLI | tar -x -C "$RUNNER_TEMP/nli-014-source"
          python -B "$RUNNER_TEMP/nli-014-source/NLI/tools/build_deb.py" --output "$RUNNER_TEMP/nli-old-package/neiro-nli_0.1.4_all.deb"
          mkdir -p "$RUNNER_TEMP/nli-015-source"
          git archive c958ec59c69c267396cd728776c8821e2d21b55d NLI | tar -x -C "$RUNNER_TEMP/nli-015-source"
          python -B "$RUNNER_TEMP/nli-015-source/NLI/tools/build_deb.py" --output "$RUNNER_TEMP/nli-old-package/neiro-nli_0.1.5_all.deb"
          mkdir -p "$RUNNER_TEMP/nli-016-source" "$RUNNER_TEMP/nli-017-source"
          git archive e4cb5637e60fd9e120b0eae263f0bb36f6878ec9 NLI | tar -x -C "$RUNNER_TEMP/nli-016-source"
          python -B "$RUNNER_TEMP/nli-016-source/NLI/tools/build_deb.py" --output "$RUNNER_TEMP/nli-old-package/neiro-nli_0.1.6_all.deb"
          git archive 9f90f17dc91f9d1ff753be66c18506027a5c03b1 NLI | tar -x -C "$RUNNER_TEMP/nli-017-source"
          python -B "$RUNNER_TEMP/nli-017-source/NLI/tools/build_deb.py" --output "$RUNNER_TEMP/nli-old-package/neiro-nli_0.1.7_all.deb"
          mkdir -p "$RUNNER_TEMP/nli-018-source" "$RUNNER_TEMP/nli-019-source"
          git archive d3bc8fcd78c6f4133cb4824ef74a589d90026373 NLI | tar -x -C "$RUNNER_TEMP/nli-018-source"
          python -B "$RUNNER_TEMP/nli-018-source/NLI/tools/build_deb.py" --output "$RUNNER_TEMP/nli-old-package/neiro-nli_0.1.8_all.deb"
          git archive df484b8bf22835001d69ddb2dd18e3eafd3792b0 NLI | tar -x -C "$RUNNER_TEMP/nli-019-source"
          python -B "$RUNNER_TEMP/nli-019-source/NLI/tools/build_deb.py" --output "$RUNNER_TEMP/nli-old-package/neiro-nli_0.1.9_all.deb"
          python -B Systems/NST/tools/prepare_hhm.py --commit d75710dad93906af8869dcce48d26e14673b63fb --role boiler --output Systems/NST/build/field-hhm
          python -B Systems/NST/tools/prepare_hhm31.py --commit 14354bcf1e0033c51f02f0b242bea8aa7fa29e4e --role boiler --output Systems/NST/build/field-hhm31
          docker run --rm --hostname wirenboard-ABF62SL -e NLI_DISPOSABLE_CI=1 \
            -v "$PWD/Systems/NST/dist:/packages:ro" -v "$RUNNER_TEMP/nli-old-package:/old:ro" \
            -v "$PWD/Systems/NST/tests:/tests:ro" -v "$PWD/Systems/NST/build/field-hhm/payload:/payload:ro" \
            -v "$PWD/Systems/NST/build/field-hhm31/payload:/payload31:ro" \
            -v "$RUNNER_TEMP/nli-persistent:/mnt/data" -v "$RUNNER_TEMP/nli-evidence:/evidence" \
            debian:trixie-slim sh /tests/wb_package_smoke.sh first
          docker run --rm --hostname wirenboard-ABF62SL -e NLI_DISPOSABLE_CI=1 \
            -v "$PWD/Systems/NST/dist:/packages:ro" -v "$PWD/Systems/NST/tests:/tests:ro" \
            -v "$RUNNER_TEMP/nli-persistent:/mnt/data" -v "$RUNNER_TEMP/nli-evidence:/evidence" \
            debian:trixie-slim sh /tests/wb_package_smoke.sh fit
      - uses: actions/upload-artifact@v4
        with:
          name: nst-2.0-deb
          path: Systems/NST/dist/nst_2.0_all.deb*
          if-no-files-found: error
