name: NLP 237 D14 physical transit quantity reconciliation

on:
  pull_request:
    paths:
      - '.github/workflows/nlp-237-d14-transit-quantity.yml'
      - 'Systems/NLP/src/nl_project_2/cables/transit_reconciliation.py'
      - 'Systems/NLP/src/nl_project_2/cables/service.py'
      - 'Systems/NLP/tests/cad_sync/test_issue237_d14_transit_quantity_reconciliation.py'
      - 'Systems/NLP/tests/cables/test_cable_service.py'
      - 'Systems/NLP/tests/cables/test_lines_spreadsheet_service.py'
      - 'Systems/NLP/docs/engineering/ISSUE_237_D14_QUANTITY_RECONCILIATION.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d14-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Systems/NLP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0
      - name: Pinned test dependencies
        run: |
          python -m pip install 'SQLAlchemy==2.0.51' 'alembic==1.18.5' \
            'pytest==9.1.1' 'pytest-qt==4.5.0' 'PySide6==6.11.1' \
            'ruff==0.15.22'
      - name: Lint strict format with actionable diff
        run: |
          python -m ruff check --diff \
            src/nl_project_2/cables/transit_reconciliation.py \
            tests/cad_sync/test_issue237_d14_transit_quantity_reconciliation.py || true
          python -m ruff format --diff \
            src/nl_project_2/cables/transit_reconciliation.py \
            src/nl_project_2/cables/service.py \
            tests/cad_sync/test_issue237_d14_transit_quantity_reconciliation.py || true
          python -m ruff check \
            src/nl_project_2/cables/transit_reconciliation.py \
            src/nl_project_2/cables/service.py \
            tests/cad_sync/test_issue237_d14_transit_quantity_reconciliation.py
          python -m ruff format --check \
            src/nl_project_2/cables/transit_reconciliation.py \
            src/nl_project_2/cables/service.py \
            tests/cad_sync/test_issue237_d14_transit_quantity_reconciliation.py
      - name: D14 read-only versus authoritative quantities and D13-D10 regressions
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q \
            tests/cad_sync/test_issue237_d14_transit_quantity_reconciliation.py \
            tests/cad_sync/test_issue237_d13_transit_store.py \
            tests/cad_sync/test_issue237_d12_transit_physical.py \
            tests/cad_sync/test_issue237_d11_transit_readonly.py \
            tests/cad_sync/test_issue237_d10_track_internal_power.py \
            tests/persistence/test_issue237_d13_transit_migration.py \
            tests/cables/test_cable_service.py \
            tests/cables/test_lines_spreadsheet_service.py \
            tests/cables/test_p0004_segment_recalculation.py
