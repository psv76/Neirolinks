name: NLP 237 D13 staged physical transit persistence and schema gate

on:
  pull_request:
    paths:
      - '.github/workflows/nlp-237-d13-transit-store.yml'
      - 'Systems/NLP/src/nl_project_2/persistence/schema.py'
      - 'Systems/NLP/src/nl_project_2/persistence/migration.py'
      - 'Systems/NLP/src/nl_project_2/persistence/migrations/versions/000000000007_persistence_topology_model.py'
      - 'Systems/NLP/tests/persistence/test_migrations.py'
      - 'Systems/NLP/tests/cad_sync/test_issue237_physical_dali_storage.py'
      - 'Systems/NLP/src/nl_project_2/persistence/migrations/versions/000000000016_transit_physical_staging.py'
      - 'Systems/NLP/src/nl_project_2/cad_sync/transit_physical_store.py'
      - 'Systems/NLP/tests/cad_sync/test_issue237_d13_transit_store.py'
      - 'Systems/NLP/tests/persistence/test_issue237_d13_transit_migration.py'
      - 'Systems/NLP/tests/persistence/test_issue237_physical_dali_migration.py'
      - 'Systems/NLP/docs/engineering/ISSUE_237_D13_STAGED_TRANSIT_PERSISTENCE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staged-transit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Systems/NLP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0
      - name: Pinned test dependencies
        run: |
          python -m pip install 'SQLAlchemy==2.0.51' 'alembic==1.18.5' \
            'pytest==9.1.1' 'pytest-qt==4.5.0' 'PySide6==6.11.1' \
            'ruff==0.15.22'
      - name: Strict Ruff lint/format and printed differences
        run: |
          python -m ruff check --diff \
            src/nl_project_2/cad_sync/transit_physical_store.py \
            tests/cad_sync/test_issue237_d13_transit_store.py \
            tests/persistence/test_issue237_d13_transit_migration.py || true
          python -m ruff format --diff \
            src/nl_project_2/cad_sync/transit_physical_store.py \
            tests/cad_sync/test_issue237_d13_transit_store.py \
            tests/persistence/test_issue237_d13_transit_migration.py || true
          python -m ruff check \
            src/nl_project_2/persistence/schema.py \
            src/nl_project_2/persistence/migration.py \
            src/nl_project_2/persistence/migrations/versions/000000000007_persistence_topology_model.py \
            src/nl_project_2/persistence/migrations/versions/000000000016_transit_physical_staging.py \
            src/nl_project_2/cad_sync/transit_physical_store.py \
            tests/cad_sync/test_issue237_d13_transit_store.py \
            tests/persistence/test_issue237_d13_transit_migration.py \
            tests/persistence/test_issue237_physical_dali_migration.py \
            tests/persistence/test_migrations.py \
            tests/cad_sync/test_issue237_physical_dali_storage.py
          python -m ruff format --check \
            src/nl_project_2/persistence/schema.py \
            src/nl_project_2/persistence/migration.py \
            src/nl_project_2/persistence/migrations/versions/000000000016_transit_physical_staging.py \
            src/nl_project_2/cad_sync/transit_physical_store.py \
            tests/cad_sync/test_issue237_d13_transit_store.py \
            tests/persistence/test_issue237_d13_transit_migration.py \
            tests/persistence/test_issue237_physical_dali_migration.py
      - name: Migration gate, D13 staged storage, D12 D11 and D10 regressions
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q \
            tests/persistence/test_issue237_d13_transit_migration.py \
            tests/persistence/test_issue237_physical_dali_migration.py \
            tests/persistence/test_migrations.py \
            tests/cad_sync/test_issue237_physical_dali_storage.py \
            tests/cad_sync/test_issue237_d13_transit_store.py \
            tests/cad_sync/test_issue237_d12_transit_physical.py \
            tests/cad_sync/test_issue237_d11_transit_readonly.py \
            tests/cad_sync/test_issue237_d10_track_internal_power.py
