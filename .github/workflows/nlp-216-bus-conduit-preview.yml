name: NLP 216 BUS Conduit read-only quantity preview

on:
  pull_request:
    paths:
      - 'Systems/NLP/src/nl_project_2/cables/bus_conduit_preview.py'
      - 'Systems/NLP/tests/cables/test_bus_conduit_preview.py'
      - '.github/workflows/nlp-216-bus-conduit-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bus-conduit-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Systems/NLP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime test dependencies
        run: |
          python -m pip install \
            'SQLAlchemy==2.0.51' 'alembic==1.18.5' \
            'pytest==9.1.1' 'ruff==0.15.22'
      - name: Read-only candidate and physical identity checks
        env:
          PYTHONPATH: src
        run: |
          python -m ruff check \
            src/nl_project_2/cables/bus_conduit_preview.py \
            tests/cables/test_bus_conduit_preview.py
          python -m ruff format --check \
            src/nl_project_2/cables/bus_conduit_preview.py \
            tests/cables/test_bus_conduit_preview.py
          python -m pytest -q \
            tests/cables/test_bus_conduit_preview.py \
            tests/cables/test_conduit_audit.py \
            tests/cables/test_physical_identity_repository.py
