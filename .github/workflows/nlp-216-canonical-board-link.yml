name: NLP 216 Canonical BOARD link recovery

on:
  pull_request:
    paths:
      - 'Systems/NLP/src/nl_project_2/cad_sync/service.py'
      - 'Systems/NLP/tests/cad_sync/test_issue216_missing_board_link.py'
      - '.github/workflows/nlp-216-canonical-board-link.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-board:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Systems/NLP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0
          python -m pip install \
            'SQLAlchemy==2.0.51' 'alembic==1.18.5' \
            'pytest==9.1.1' 'pytest-qt==4.5.0' \
            'PySide6==6.11.1' 'ruff==0.15.22'
      - name: Canonical BOARD linkage and safe selective DWG synchronization
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m ruff check \
            src/nl_project_2/cad_sync/service.py \
            tests/cad_sync/test_issue216_missing_board_link.py
          python -m ruff format --check \
            src/nl_project_2/cad_sync/service.py \
            tests/cad_sync/test_issue216_missing_board_link.py
          python -m pytest -q \
            tests/cad_sync/test_issue216_missing_board_link.py \
            tests/cad_sync/test_issue216_board_dependent_lengths.py \
            tests/cad_sync/test_sync_service.py
