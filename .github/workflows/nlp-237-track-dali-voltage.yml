name: NLP 237 track DALI voltage group (D1 smoke)

on:
  pull_request:
    paths:
      - '.github/workflows/nlp-237-track-dali-voltage.yml'
      - 'Systems/NLP/src/nl_project_2/cad_contract/validator.py'
      - 'Systems/NLP/tools/check_issue237_track_dali_voltage.py'
      - 'Systems/NLP/resources/autocad/block_contract.json'
  workflow_dispatch:

jobs:
  voltage-group:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal runtime import dependency
        run: python -m pip install 'SQLAlchemy>=2,<3'
      - name: Focused DALI feeder group smoke, no DB/AutoCAD
        run: PYTHONPATH=Systems/NLP/src python Systems/NLP/tools/check_issue237_track_dali_voltage.py
