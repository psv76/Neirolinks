name: NLP 237 passive DALI physical owner snapshot (D6)

on:
  pull_request:
    paths:
      - '.github/workflows/nlp-237-passive-physical-owner.yml'
      - 'Systems/NLP/src/nl_project_2/cad_sync/reconciliation.py'
      - 'Systems/NLP/src/nl_project_2/cad_sync/service.py'
      - 'Systems/NLP/tests/cad_sync/test_issue237_passive_physical_ownership.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  passive-owners:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Systems/NLP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt import libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0
      - name: Install pinned test dependencies
        run: |
          python -m pip install 'SQLAlchemy==2.0.51' 'alembic==1.18.5' \
            'pytest==9.1.1' 'pytest-qt==4.5.0' 'PySide6==6.11.1' \
            'ruff==0.15.22'
      - name: Strict lint and format
        run: |
          python -m ruff check src/nl_project_2/cad_sync/service.py \
            src/nl_project_2/cad_sync/reconciliation.py \
            tests/cad_sync/test_issue237_passive_physical_ownership.py
          python -m ruff format --diff src/nl_project_2/cad_sync/service.py \
            src/nl_project_2/cad_sync/reconciliation.py \
            tests/cad_sync/test_issue237_passive_physical_ownership.py || true
      - name: Typed passive plans plus isolated Project SQLite and DALI graph
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q \
            tests/cad_sync/test_issue237_passive_physical_ownership.py \
            tests/cad_sync/test_issue237_endpoint_transactions.py \
            tests/cad_sync/test_issue237_bus_outlet_owner_gate.py \
            tests/cad_sync/test_issue237_project_bus_context.py \
            tests/cad_contract/test_issue237_dali_graph.py \
            tests/cad_contract/test_issue237_track_dali_integration.py
