name: NLP 216 physical Conduit specification

on:
  pull_request:
    paths:
      - 'Systems/NLP/src/nl_project_2/specification/**'
      - 'Systems/NLP/tests/specification/**'
      - '.github/workflows/nlp-216-conduit-spec.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conduit-specification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Systems/NLP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0
      - name: Install test dependencies
        run: |
          python -m pip install 'SQLAlchemy==2.0.51' 'alembic==1.18.5' 'pytest==9.1.1' 'pytest-qt==4.5.0' 'PySide6==6.11.1' 'ruff==0.15.22'
      - name: Check formatting and lint
        run: |
          python -m ruff check src/nl_project_2/specification/service.py tests/specification/test_physical_conduit_spec_216.py
          python -m ruff format --check src/nl_project_2/specification/service.py tests/specification/test_physical_conduit_spec_216.py
      - name: Run Q06 specification and existing CAD/BUS tests
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests/specification tests/buses/test_branched_service.py tests/cad_sync/test_sync_service.py tests/cad_sync/test_p0003_reconciliation.py tests/cad_sync/test_issue134_box_identity.py
