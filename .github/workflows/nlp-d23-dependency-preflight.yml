name: NLP D23 dependency preflight

on:
  pull_request:
    paths:
      - 'Systems/NLP/**'
      - '.github/workflows/nlp-d23-dependency-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-merge-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch independent D22 and Stage C heads
        run: |
          git fetch --no-tags origin \
            +refs/heads/fix/nlp-237-d22-shadow-integrity:refs/remotes/origin/fix/nlp-237-d22-shadow-integrity \
            +refs/heads/fix/nlp-216-length-q04q05q08:refs/remotes/origin/fix/nlp-216-length-q04q05q08
      - name: Compile preflight
        run: python -m py_compile Systems/NLP/tools/d23_dependency_preflight.py
      - name: Probe read-only integration conflict
        run: python Systems/NLP/tools/d23_dependency_preflight.py

  d22-synthetic-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Systems/NLP
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0
      - name: Install pinned synthetic dependencies
        run: |
          python -m pip install 'SQLAlchemy==2.0.51' 'alembic==1.18.5' \
            'pytest==9.1.1' 'pytest-qt==4.5.0' 'PySide6==6.11.1' \
            'ruff==0.15.22'
      - name: D22 synthetic and canonical non-write regression
        run: |
          python -m pytest -q \
            tests/cad_sync/test_issue237_d21_quantity_shadow.py \
            tests/cad_sync/test_issue237_d20_bridge_fresh_scan.py \
            tests/cad_sync/test_issue237_d19_dwg_scan_lineage.py \
            tests/cad_sync/test_issue237_d18_activation_readiness.py \
            tests/cad_sync/test_issue237_d17_canonical_readback.py \
            tests/cad_sync/test_issue237_d16_quantity_prepare.py \
            tests/cad_sync/test_issue237_d15_line_preview.py \
            tests/cad_sync/test_issue237_d14_transit_quantity_reconciliation.py \
            tests/cad_sync/test_issue237_d13_transit_store.py \
            tests/cad_sync/test_issue237_d12_transit_physical.py \
            tests/cad_sync/test_issue237_d11_transit_readonly.py \
            tests/cad_sync/test_issue237_d10_track_internal_power.py \
            tests/cables/test_cable_service.py \
            tests/cables/test_p0004_segment_recalculation.py \
            tests/specification/test_service.py \
            tests/persistence/test_issue237_d16_quantity_migration.py \
            tests/persistence/test_issue237_d13_transit_migration.py

  stage-c-synthetic-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Systems/NLP
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nlp-216-length-q04q05q08
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Stage C synthetic dependencies
        run: |
          python -m pip install 'SQLAlchemy==2.0.51' 'alembic==1.18.5' \
            'pytest==9.1.1' 'ruff==0.15.22'
      - name: Stage C arithmetic and shared conduit regression
        run: |
          python -m pytest -q \
            tests/unit/test_length_policy.py \
            tests/cables/test_q06_shared_tube_length_safety.py
