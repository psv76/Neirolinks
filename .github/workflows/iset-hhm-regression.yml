name: Iset HHM regression

on:
  pull_request:
    paths:
      - 'Objects/05_16_Iset/HHM/**'
      - 'Objects/05_16_Iset/Wirenboard/wb-rules/29_hhm_iset.js'
      - 'Systems/HHM/tests/**'
      - 'Systems/HHM/core/**'
      - 'Systems/NST/diagnostics/iset-house-hhm-v1.json'
      - '.github/workflows/iset-hhm-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approved-runtime:
    name: Iset WB syntax and HHM regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check WB JavaScript syntax
        run: |
          node --check Objects/05_16_Iset/Wirenboard/wb-rules/29_hhm_iset.js
          for script in Objects/05_16_Iset/HHM/*.js; do node --check "$script"; done
      - name: Check NST diagnostics profile JSON
        run: node -e "const p=require('./Systems/NST/diagnostics/iset-house-hhm-v1.json'); if(p.component!=='hhm'||!Array.isArray(p.current_controls)) process.exit(1);"
      - name: Run every HHM offline suite
        run: |
          set -eu
          for test in Systems/HHM/tests/*.js; do
            echo "=== $test ==="
            node "$test"
          done
