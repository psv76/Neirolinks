name: NLP 237 D7 physical DALI graph storage and migration

on:
  pull_request:
    paths:
      - '.github/workflows/nlp-237-physical-dali-storage.yml'
      - 'Systems/NLP/src/nl_project_2/persistence/schema.py'
      - 'Systems/NLP/src/nl_project_2/persistence/migration.py'
      - 'Systems/NLP/src/nl_project_2/persistence/migrations/versions/000000000015_physical_dali_graph.py'
      - 'Systems/NLP/src/nl_project_2/cad_sync/service.py'
      - 'Systems/NLP/src/nl_project_2/cad_sync/physical_dali_store.py'
      - 'Systems/NLP/tests/cad_sync/test_issue237_physical_dali_storage.py'
      - 'Systems/NLP/tests/persistence/test_issue237_physical_dali_migration.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typed-dali-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Systems/NLP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt import dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0
      - name: Pin independent migration and regression test runtime
        run: |
          python -m pip install 'SQLAlchemy==2.0.51' 'alembic==1.18.5' \
            'pytest==9.1.1' 'pytest-qt==4.5.0' 'PySide6==6.11.1' \
            'ruff==0.15.22'
      - name: Lint and strict Ruff formatting
        run: |
          python -m ruff check src/nl_project_2/cad_sync/service.py \
            src/nl_project_2/cad_sync/physical_dali_store.py \
            src/nl_project_2/persistence/schema.py \
            src/nl_project_2/persistence/migration.py \
            src/nl_project_2/persistence/migrations/versions/000000000015_physical_dali_graph.py \
            src/nl_project_2/persistence/migrations/versions/000000000007_persistence_topology_model.py \
            src/nl_project_2/cad_contract/catalog.py \
            tests/cad_sync/test_issue237_physical_dali_storage.py \
            tests/persistence/test_issue237_physical_dali_migration.py
          python -m ruff format --check src/nl_project_2/cad_sync/service.py \
            src/nl_project_2/cad_sync/physical_dali_store.py \
            src/nl_project_2/persistence/schema.py \
            src/nl_project_2/persistence/migration.py \
            src/nl_project_2/persistence/migrations/versions/000000000015_physical_dali_graph.py \
            tests/persistence/test_issue237_physical_dali_migration.py
          python -m ruff format --check tests/cad_sync/test_issue237_physical_dali_storage.py
      - name: Schema 14-to-15 migration with verified backup plus physical graph regressions
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q \
            tests/persistence/test_issue237_physical_dali_migration.py \
            tests/persistence/test_migrations.py \
            tests/cad_sync/test_issue237_physical_dali_storage.py \
            tests/cad_sync/test_issue237_passive_physical_ownership.py \
            tests/cad_sync/test_issue237_endpoint_transactions.py \
            tests/cad_sync/test_issue237_bus_outlet_owner_gate.py \
            tests/cad_sync/test_issue237_project_bus_context.py \
            tests/cad_contract/test_issue237_dali_graph.py \
            tests/cad_contract/test_issue237_track_dali_integration.py
